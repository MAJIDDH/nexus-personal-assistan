name: API PostgreSQL Integration

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-postgres-integration.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "apps/api/**"
      - ".github/workflows/api-postgres-integration.yml"

permissions:
  contents: read

concurrency:
  group: api-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: Verify migrations against disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus_dev
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://nexus:nexus_local_only@localhost:5432/nexus_dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply database migrations
        run: npm run migrate
      - name: Verify migrations are repeatable
        run: npm run migrate
      - name: Verify schema and parameterized persistence
        run: |
          node <<'NODE'
          const { Pool } = require('pg');
          (async () => {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 1 });
            try {
              const migrations = await pool.query('SELECT version FROM schema_migrations ORDER BY version');
              if (migrations.rows.length !== 5) throw new Error('Expected exactly five migrations to be recorded');
              const title = 'CI synthetic idea ' + Date.now();
              const inserted = await pool.query(
                'INSERT INTO content_ideas (title, concept, objective) VALUES ($1, $2, $3) RETURNING title, status',
                [title, 'Synthetic integration-test concept', 'grow_followers'],
              );
              if (inserted.rows[0]?.title !== title || inserted.rows[0]?.status !== 'draft') {
                throw new Error('Content idea insert did not return the expected draft');
              }
              const fetched = await pool.query('SELECT title FROM content_ideas WHERE title = $1', [title]);
              if (fetched.rowCount !== 1) throw new Error('Content idea could not be read back');
              await pool.query('DELETE FROM content_ideas WHERE title = $1', [title]);
              const taskTitle = 'CI synthetic task ' + Date.now();
              const task = await pool.query(
                'INSERT INTO tasks (title, project_key, importance, urgency) VALUES ($1, $2, $3, $4) RETURNING title, status, project_key',
                [taskTitle, 'golddyousefi', 5, 4],
              );
              if (task.rows[0]?.title !== taskTitle || task.rows[0]?.status !== 'open' || task.rows[0]?.project_key !== 'golddyousefi') {
                throw new Error('Task insert did not return expected defaults');
              }
              const taskRead = await pool.query('SELECT title FROM tasks WHERE title = $1', [taskTitle]);
              if (taskRead.rowCount !== 1) throw new Error('Task could not be read back');
              const events = await pool.query(
                "SELECT action FROM audit_events WHERE entity_type = 'task' AND entity_id = (SELECT id FROM tasks WHERE title = $1)",
                [taskTitle],
              );
              if (events.rows.length !== 1 || events.rows[0]?.action !== 'created') {
                throw new Error('Task creation was not recorded in the audit trail');
              }
              const taskId = task.rows[0] && (await pool.query('SELECT id FROM tasks WHERE title = $1', [taskTitle])).rows[0]?.id;
              if (!taskId) throw new Error('Inserted task did not have an ID');

              const updatedTitle = taskTitle + ' updated';
              await pool.query('UPDATE tasks SET title = $2 WHERE id = $1', [taskId, updatedTitle]);
              await pool.query("UPDATE tasks SET status = $2 WHERE id = $1", [taskId, 'in_progress']);

              const changeEvents = await pool.query(
                'SELECT action, before_data, after_data FROM audit_events WHERE entity_type = $1 AND entity_id = $2 ORDER BY id',
                ['task', taskId],
              );
              const actions = changeEvents.rows.map((event) => event.action);
              if (actions.join(',') !== 'created,updated,status_changed') {
                throw new Error('Task updates and status transitions were not recorded in order: ' + actions.join(','));
              }
              if (changeEvents.rows[1]?.before_data?.title !== taskTitle ||
                  changeEvents.rows[1]?.after_data?.title !== updatedTitle) {
                throw new Error('Task update audit event did not preserve before/after snapshots');
              }
              if (changeEvents.rows[2]?.before_data?.status !== 'open' ||
                  changeEvents.rows[2]?.after_data?.status !== 'in_progress') {
                throw new Error('Task status audit event did not preserve before/after snapshots');
              }

              const feedback = await pool.query(
                'INSERT INTO task_feedback (task_id, rating, note) VALUES ($1, $2, $3) RETURNING rating, note',
                [taskId, 'useful', 'CI synthetic feedback'],
              );
              if (feedback.rows[0]?.rating !== 'useful') throw new Error('Task feedback was not persisted');
              await pool.query('DELETE FROM task_feedback WHERE task_id = $1', [taskId]);
              await pool.query('DELETE FROM tasks WHERE title = $1', [taskTitle]);
              process.stdout.write('PostgreSQL migrations, task persistence, create/update/status audit snapshots, and feedback persistence passed.\n');
            } finally {
              await pool.end();
            }
          })().catch((error) => {
            process.stderr.write(error.stack || error.message);
            process.exitCode = 1;
          });
          NODE
